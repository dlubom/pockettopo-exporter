name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag
        required: true
        default: v1.0.0
      ci_run_id:
        description: Successful main CI run for exactly the tagged commit
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify exact-SHA CI and annotated tag
        run: |
          test "$RELEASE_TAG" = v1.0.0
          python3 scripts/release_gate.py --repo "$GH_REPO" --run-id "$CI_RUN_ID" --revision "$(git rev-parse HEAD)" --tag "$RELEASE_TAG" --output build/release-ci.json
      - name: Download and assemble all six validated native packages
        run: |
          gh run download "$CI_RUN_ID" --pattern 'release-*' --dir build/downloaded-packages
          python3 scripts/assemble-release.py --input build/downloaded-packages --output build/release --revision "$(git rev-parse HEAD)" --version 1.0.0
      - name: Create complete draft release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('build/release-ci.json').read_text())
          notes = Path('docs/releases/1.0.0.md').read_text()
          notes += '\nSource revision: `' + evidence['source_revision'] + '`.\n'
          notes += '[Verified exact-SHA CI](' + evidence['run_url'] + '). All required jobs passed.\n'
          Path('build/release-notes.md').write_text(notes)
          PY
          gh release create "$RELEASE_TAG" --verify-tag --draft --title 'PocketTopo Exporter 1.0.0' --notes-file build/release-notes.md build/release/*.zip build/release/SHA256SUMS build/release/release-validation.json
      - name: Verify uploaded asset bytes before publication
        run: |
          gh release download "$RELEASE_TAG" --dir build/release-readback
          python3 scripts/release_gate.py --repo "$GH_REPO" --run-id "$CI_RUN_ID" --revision "$(git rev-parse HEAD)" --tag "$RELEASE_TAG" --expected-assets build/release --downloaded-assets build/release-readback --output build/release-readback.json
      - name: Publish stable release
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest
          python3 scripts/release_gate.py --repo "$GH_REPO" --run-id "$CI_RUN_ID" --revision "$(git rev-parse HEAD)" --tag "$RELEASE_TAG" --published --output build/release-published.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-publication-${{ inputs.tag }}
          path: |
            build/release-ci.json
            build/release-readback.json
            build/release-published.json
          if-no-files-found: warn
