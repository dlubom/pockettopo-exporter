name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    # Linux also runs the complete cumulative mutation campaign and controls.
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 40 || 25 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: bash scripts/tools.sh
      - run: bash scripts/check.sh
      - if: runner.os == 'Linux'
        run: |
          bash scripts/mutation.sh
          bash scripts/mutation-trial.sh
