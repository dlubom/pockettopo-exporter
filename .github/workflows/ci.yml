name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: bash scripts/tools.sh
      - run: bash scripts/check.sh
      - name: Build and validate offline distribution
        run: python3 scripts/distribution.py --output build/distribution
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-${{ matrix.os }}-${{ github.sha }}
          path: build/distribution/
          if-no-files-found: error
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fetch pinned TOP corpus
        run: |
          mkdir -p build/corpus
          curl --fail --location --silent --show-error https://codeload.github.com/dlubom/test2/tar.gz/4c00c008a8dd441d70f9c62aa376c20b5914c7e0 | tar -xz --wildcards --no-same-owner -C build/corpus '*.top'
      - name: Validate every source and export profile
        env:
          GOTOOLCHAIN: local
        run: |
          go build -o build/pockettopo-exporter ./cmd/pockettopo-exporter
          python3 scripts/verify-evidence.py
          python3 scripts/validate-corpus.py --binary build/pockettopo-exporter --corpus build/corpus/test2-4c00c008a8dd441d70f9c62aa376c20b5914c7e0 --report build/corpus-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: corpus-${{ github.sha }}
          path: build/corpus-report.json
          if-no-files-found: error
  walls-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y libproj-dev libgdal-dev libwxgtk3.2-dev
      - run: bash scripts/install-walls-consumer.sh
      - name: Verify Walls syntax, coordinates and rejection control
        run: |
          go build -o build/pockettopo-exporter ./cmd/pockettopo-exporter
          python3 scripts/validate-walls.py --binary build/pockettopo-exporter --cavern build/walls-consumer/survex-1.4.22/src/cavern --dump3d build/walls-consumer/survex-1.4.22/src/dump3d --report build/walls-consumer-report.json
      - name: Verify SVX syntax, coordinates and rejection control
        run: python3 scripts/validate-survex.py --binary build/pockettopo-exporter --cavern build/walls-consumer/survex-1.4.22/src/cavern --dump3d build/walls-consumer/survex-1.4.22/src/dump3d --report build/survex-consumer-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: walls-consumer-${{ github.sha }}
          path: |
            build/walls-consumer-report.json
            build/survex-consumer-report.json
          if-no-files-found: error

  mutation-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: groups
        shell: bash
        run: |
          bash scripts/mutation-dispatch-trial.sh
          matrix=$(bash scripts/mutation.sh --matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  mutation:
    needs: mutation-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - if: startsWith(matrix.group, 'gremlins-')
        run: bash scripts/tools.sh
      - name: Run mutation group
        env:
          MUTATION_GROUP: ${{ matrix.group }}
        run: bash scripts/mutation.sh "$MUTATION_GROUP"
      - if: matrix.group == 'gremlins-output'
        run: bash scripts/mutation-trial.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutations-${{ matrix.group }}-${{ github.sha }}
          path: |
            mutation.json
            build/*mutation*.json
          if-no-files-found: error

  complete:
    name: CI complete
    if: always()
    needs: [check, corpus, walls-consumer, mutation-plan, mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks and mutation groups
        shell: bash
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          PLAN_RESULT: ${{ needs.mutation-plan.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
          CORPUS_RESULT: ${{ needs.corpus.result }}
          WALLS_RESULT: ${{ needs.walls-consumer.result }}
        run: |
          if [[ "$CHECK_RESULT" != success || "$CORPUS_RESULT" != success || "$WALLS_RESULT" != success || "$PLAN_RESULT" != success || "$MUTATION_RESULT" != success ]]; then
            printf 'CI incomplete: checks=%s corpus=%s walls=%s plan=%s mutations=%s\n' "$CHECK_RESULT" "$CORPUS_RESULT" "$WALLS_RESULT" "$PLAN_RESULT" "$MUTATION_RESULT" >&2
            exit 1
          fi
