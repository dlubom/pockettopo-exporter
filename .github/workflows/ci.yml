name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: bash scripts/tools.sh
      - run: bash scripts/check.sh
  mutation-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: groups
        shell: bash
        run: |
          bash scripts/mutation-dispatch-trial.sh
          matrix=$(bash scripts/mutation.sh --matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  mutation:
    needs: mutation-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - if: matrix.group == 'gremlins'
        run: bash scripts/tools.sh
      - name: Run mutation group
        env:
          MUTATION_GROUP: ${{ matrix.group }}
        run: bash scripts/mutation.sh "$MUTATION_GROUP"
      - if: matrix.group == 'gremlins'
        run: bash scripts/mutation-trial.sh

  complete:
    name: CI complete
    if: always()
    needs: [check, mutation-plan, mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks and mutation groups
        shell: bash
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          PLAN_RESULT: ${{ needs.mutation-plan.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
        run: |
          if [[ "$CHECK_RESULT" != success || "$PLAN_RESULT" != success || "$MUTATION_RESULT" != success ]]; then
            printf 'CI incomplete: checks=%s plan=%s mutations=%s\n' "$CHECK_RESULT" "$PLAN_RESULT" "$MUTATION_RESULT" >&2
            exit 1
          fi
