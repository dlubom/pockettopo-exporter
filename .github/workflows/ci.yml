name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: bash scripts/tools.sh
      - run: bash scripts/check.sh
      - name: Build and validate offline distribution
        run: python3 scripts/distribution.py --output build/distribution
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-${{ matrix.os }}-${{ github.sha }}
          path: build/distribution/
          if-no-files-found: error
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fetch pinned TOP corpus
        run: |
          mkdir -p build/corpus
          curl --fail --location --silent --show-error https://codeload.github.com/dlubom/test2/tar.gz/4c00c008a8dd441d70f9c62aa376c20b5914c7e0 | tar -xz --wildcards --no-same-owner -C build/corpus '*.top'
      - name: Validate every source and export profile
        env:
          GOTOOLCHAIN: local
        run: |
          go build -o build/pockettopo-exporter ./cmd/pockettopo-exporter
          python3 scripts/verify-evidence.py
          python3 scripts/validate-corpus.py --binary build/pockettopo-exporter --corpus build/corpus/test2-4c00c008a8dd441d70f9c62aa376c20b5914c7e0 --report build/corpus-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: corpus-${{ github.sha }}
          path: build/corpus-report.json
          if-no-files-found: error
  release-package:
    name: release-package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: windows-amd64
            os: windows-2025
          - target: windows-arm64
            os: windows-11-arm
          - target: darwin-amd64
            os: macos-15-intel
          - target: darwin-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify target, ordinary native tests and release controls
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(go env GOOS)-$(go env GOARCH)" = "$EXPECTED_TARGET"
          go test -count=1 ./...
          python3 scripts/test_validation.py
          python3 scripts/test_assemble_release.py
          python3 scripts/test_release_gate.py
      - name: Build and verify the native 1.0.0 archive
        run: python3 scripts/distribution.py --version 1.0.0 --output build/release-package
      - name: Validate optional Windows menu in Explorer
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import zipfile; zipfile.ZipFile(next(Path('build/release-package').glob('*.zip'))).extractall('build/menu-package')"
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }
          ./scripts/validate-windows-menu.ps1 -Binary build/menu-package/pockettopo-exporter.exe -Output build/windows-menu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}-${{ github.sha }}
          path: build/release-package/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && startsWith(matrix.target, 'windows-')
        with:
          name: windows-menu-${{ matrix.target }}-${{ github.sha }}
          path: build/windows-menu/
          if-no-files-found: warn
  walls-native:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Extract checksum-pinned original Walls
        shell: pwsh
        run: |
          New-Item -ItemType Directory build -Force | Out-Null
          $msi = Join-Path $PWD 'build\WallsInstaller.msi'
          Invoke-WebRequest 'https://github.com/wallscavesurvey/walls/releases/download/v2.3.0-beta.1/WallsInstaller-2.3.0-beta.1.2025-09-13.msi' -OutFile $msi
          if ((Get-FileHash $msi -Algorithm SHA256).Hash.ToLower() -ne '11445a522760ef98876c3d025e90b734c2073d8a033717c7313a8da130168ce0') { throw 'Walls installer identity differs' }
          $target = Join-Path $PWD 'build\walls-runtime'
          $log = Join-Path $PWD 'build\walls-extraction.log'
          $p = Start-Process msiexec.exe -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$target`" /l*v `"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Walls extraction failed: $($p.ExitCode)" }
      - name: Compile reviewed SRV in original Walls and verify native databases
        shell: pwsh
        run: |
          go build -o build/pockettopo-exporter.exe ./cmd/pockettopo-exporter
          if ($LASTEXITCODE -ne 0) { throw 'Go build failed' }
          $walls = @(Get-ChildItem build/walls-runtime -Recurse -Filter Walls32.exe)
          if ($walls.Count -ne 1) { throw 'Missing or ambiguous original Walls executable' }
          ./scripts/validate-walls-native.ps1 -Binary build/pockettopo-exporter.exe -Walls $walls[0].FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: original-walls-${{ github.sha }}
          path: |
            build/walls-native/
            build/walls-extraction.log
          if-no-files-found: error
  survex-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build checksum-pinned Survex 1.4.22
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libproj-dev libgdal-dev libwxgtk3.2-dev
          mkdir -p build/survex-runtime
          curl --fail --location --silent --show-error https://survex.com/software/1.4.22/survex-1.4.22.tar.gz -o build/survex-runtime/source.tar.gz
          printf '%s  %s\n' a26962d888621cfd2043a7cc6a227fc905130dfbd14c450dc1c4c02fbfdd9dbc build/survex-runtime/source.tar.gz | sha256sum --check
          tar -xzf build/survex-runtime/source.tar.gz -C build/survex-runtime
          cd build/survex-runtime/survex-1.4.22
          ./configure
          make -C src -j2 cavern dump3d
      - name: Verify SVX geometry, statistics, automatic templates and controls
        env:
          GOTOOLCHAIN: local
        run: |
          go build -o build/pockettopo-exporter ./cmd/pockettopo-exporter
          export SURVEXLIB="$PWD/build/survex-runtime/survex-1.4.22/lib"
          python3 scripts/validate-survex.py --binary build/pockettopo-exporter --cavern build/survex-runtime/survex-1.4.22/src/cavern --dump3d build/survex-runtime/survex-1.4.22/src/dump3d --output build/survex-native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: original-survex-${{ github.sha }}
          path: |
            build/survex-native/
            build/survex-runtime/survex-1.4.22/config.log
          if-no-files-found: error
  mutation-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: groups
        shell: bash
        run: |
          bash scripts/mutation-dispatch-trial.sh
          matrix=$(bash scripts/mutation.sh --matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  mutation:
    needs: mutation-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - if: startsWith(matrix.group, 'gremlins-')
        run: bash scripts/tools.sh
      - name: Run mutation group
        env:
          MUTATION_GROUP: ${{ matrix.group }}
        run: bash scripts/mutation.sh "$MUTATION_GROUP"
      - if: matrix.group == 'gremlins-output'
        run: bash scripts/mutation-trial.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutations-${{ matrix.group }}-${{ github.sha }}
          path: |
            mutation.json
            build/*-mutation.json
            build/mutation-weak.json
          if-no-files-found: warn

  complete:
    name: CI complete
    if: always()
    needs: [check, corpus, walls-native, survex-native, mutation-plan, mutation, release-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks and mutation groups
        shell: bash
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          PLAN_RESULT: ${{ needs.mutation-plan.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
          CORPUS_RESULT: ${{ needs.corpus.result }}
          SURVEX_RESULT: ${{ needs.survex-native.result }}
          WALLS_RESULT: ${{ needs.walls-native.result }}
          RELEASE_RESULT: ${{ needs.release-package.result }}
        run: |
          if [[ "$CHECK_RESULT" != success || "$CORPUS_RESULT" != success || "$WALLS_RESULT" != success || "$SURVEX_RESULT" != success || "$PLAN_RESULT" != success || "$MUTATION_RESULT" != success || "$RELEASE_RESULT" != success ]]; then
            printf 'CI incomplete: checks=%s corpus=%s Walls=%s Survex=%s plan=%s mutations=%s\n' "$CHECK_RESULT" "$CORPUS_RESULT" "$WALLS_RESULT" "$SURVEX_RESULT" "$PLAN_RESULT" "$MUTATION_RESULT" >&2
            printf 'Native release packages=%s\n' "$RELEASE_RESULT" >&2
            exit 1
          fi
